name: Docker Build Smoke Test

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/cpp/**"
      - "include/**"
      - "resources/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "setup.sh"
      - "tools/version.py"
      - ".github/workflows/docker-build-smoke-test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Stamp version
        run: |
          VERSION=$(python3 tools/version.py)
          printf '%s\n' "$VERSION" > .version

      - name: Build Docker image
        run: |
          docker build -t lemonade:test .

      - name: Run container
        run: |
          docker run -d \
            --name lemonade-test \
            -p 13305:13305 \
            lemonade:test

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Lemonade to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:13305/live > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          docker logs lemonade-test
          exit 1

      - name: CLI on PATH regression check
        run: |
          # Regression guard: the lemonade/lemond binaries must be callable by
          # name via `docker exec` (i.e. on PATH), not just by absolute path.
          docker exec lemonade-test sh -lc 'command -v lemonade && command -v lemond'
          docker exec lemonade-test sh -lc 'lemonade status'

      - name: Bundled gufo engine check
        run: |
          # The image bundles a pinned gufo engine (Dockerfile ARG GUFO_VERSION).
          # CPU-only runners can't reach a GPU, so assert binary presence and
          # version — the recipe may report any non-installed state here.
          EXPECTED=$(grep -oE 'ARG GUFO_VERSION=[vV]?[0-9][0-9.]*' Dockerfile | sed -E 's/.*=v?//')
          if [ -z "$EXPECTED" ]; then
              echo "Could not read pinned gufo version from Dockerfile"
              exit 1
          fi
          # Floor: the pin must satisfy the backend's own minimum gate, or the
          # version-match grep would pass while every model load fails at runtime.
          # The constant is defined in the backend header, not the .cpp.
          MINIMUM=$(sed -n 's/.*kMinGufoVersion = "\([0-9.]*\)".*/\1/p' src/cpp/include/lemon/backends/gufo/gufo.h | head -1)
          if [ -z "$MINIMUM" ]; then
              echo "Could not read kMinGufoVersion from the backend header"
              exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$MINIMUM" "$EXPECTED" | sort -V | head -1)" != "$MINIMUM" ]; then
              echo "Pinned gufo version ${EXPECTED} is below the backend minimum ${MINIMUM}"
              exit 1
          fi
          # Mirror anchor: the table records the release it mirrors, and that has to
          # be the release the image bundles, or the table describes another engine.
          SHIPPED_PIN=$(docker exec lemonade-test sh -lc "sed -n 's/.*\"pin\": \"\(v[0-9.]*\)\".*/\1/p' /opt/lemonade/resources/gufo_compat.json" | head -1)
          if [ "$SHIPPED_PIN" != "v${EXPECTED}" ]; then
              echo "Shipped gufo_compat.json mirrors ${SHIPPED_PIN}, but the image bundles v${EXPECTED}"
              exit 1
          fi
          docker exec lemonade-test sh -lc "gufo --version" | grep -q "gufo version ${EXPECTED}" || {
              echo "Bundled gufo version does not match Dockerfile pin ${EXPECTED}"
              exit 1
          }
          docker exec lemonade-test sh -lc 'command -v ffmpeg && command -v ffprobe'
          curl -sf http://localhost:13305/api/v1/system-info | grep -q '"gufo"'

      - name: Load model
        run: |
          curl -X POST http://localhost:13305/api/v1/load \
            -H "Content-Type: application/json" \
            -d '{"model_name": "Qwen3-0.6B-GGUF"}'

      - name: Chat completion smoke test
        run: |
          RESPONSE=$(curl -s http://localhost:13305/api/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "Qwen3-0.6B-GGUF",
              "messages": [
                { "role": "user", "content": "Hello, Lemonade!" }
              ]
            }')

          echo "Response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"choices"' || exit 1

      - name: Cleanup
        if: always()
        run: |
          docker logs lemonade-test || true
          docker rm -f lemonade-test || true
